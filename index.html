<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technical English 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.23.0",
    "firebase/app": "https://aistudiocdn.com/firebase@^9.23.0/app",
    "firebase/auth": "https://aistudiocdn.com/firebase@^9.23.0/auth",
    "firebase/firestore": "https://aistudiocdn.com/firebase@^9.23.0/firestore",
    "firebase/storage": "https://aistudiocdn.com/firebase@^9.23.0/storage",
    "firebase/": "https://aistudiocdn.com/firebase@^12.5.0/"
  }
}
</script>
<style>
  /* Base Setup */
  html, body, #root {
    height: 100%;
    margin: 0;
    padding: 0;
  }
  html {
    background-color: #030712;
    overscroll-behavior-y: contain;
  }
  body {
    position: relative;
    overflow: hidden; /* Hide anything that spills out from the animated background */
  }

  /* Animated Background Container */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;

    background-image: 
      /* Layer 4: Concentric Glowing HUD (on the left) - more detailed */
      radial-gradient(circle at 25% 50%, transparent 22%, rgba(0, 220, 255, 0.4) 22.2%, rgba(0, 220, 255, 0.1) 24%, transparent 25%),
      radial-gradient(circle at 25% 50%, transparent 18%, rgba(0, 220, 255, 0.6) 18.2%, transparent 18.5%),
      radial-gradient(circle at 25% 50%, rgba(0, 220, 255, 0.1) 0%, transparent 18%),
      
      /* Layer 3: Dynamic Circuit-like Lines */
      repeating-linear-gradient(30deg, transparent, transparent 25px, rgba(0, 180, 255, 0.15) 25px, rgba(0, 180, 255, 0.15) 26px),
      repeating-linear-gradient(-30deg, transparent, transparent 25px, rgba(0, 180, 255, 0.15) 25px, rgba(0, 180, 255, 0.15) 26px),

      /* Layer 2: Faint Underlying Grid */
      linear-gradient(rgba(20, 80, 150, 0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20, 80, 150, 0.1) 1px, transparent 1px),

      /* Layer 1: Base Radial Glow */
      radial-gradient(ellipse at 25% 50%, hsl(215, 90%, 12%) 0%, #030712 65%);

    background-size: 
      /* HUD */
      140vmin 140vmin, 
      140vmin 140vmin,
      140vmin 140vmin,
      /* Circuits */
      160px 160px,
      160px 160px,
      /* Grid */
      30px 30px,
      30px 30px,
      /* Base */
      100% 100%;

    background-position: center center, center center, center center, 0 0, 0 0, 0 0, 0 0, center center;
    background-repeat: no-repeat, no-repeat, no-repeat, repeat, repeat, repeat, repeat, no-repeat;
    
    animation: 
      hud-pulse 6s ease-in-out infinite, 
      circuit-flow 30s linear infinite;
  }

  @keyframes hud-pulse {
    0%, 100% {
      background-size: 140vmin 140vmin, 140vmin 140vmin, 140vmin 140vmin, 160px 160px, 160px 160px, 30px 30px, 30px 30px, 100% 100%;
      opacity: 0.95;
    }
    50% {
      background-size: 150vmin 150vmin, 150vmin 150vmin, 150vmin 150vmin, 160px 160px, 160px 160px, 30px 30px, 30px 30px, 100% 100%;
      opacity: 1;
    }
  }

  @keyframes circuit-flow {
    0% {
      background-position: center center, center center, center center, 0 0, 0 0, 0 0, 0 0, center center;
    }
    100% {
      background-position: center center, center center, center center, 320px 0, -320px 0, 60px 0, 0 60px, center center;
    }
  }


  /* Root element with overlay */
  #root {
      position: relative;
      z-index: 1;
      background-color: rgba(3, 10, 25, 0.75); /* Darker, bluer overlay */
      height: 100%;
  }

  /* Add animations for slide transitions */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }
  
  @keyframes slideInFromRight {
    from { transform: translateX(5%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes slideInFromLeft {
    from { transform: translateX(-5%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes slideInFromTop {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .animate-fade-in {
    animation: fadeIn 0.5s ease-in-out;
  }
  
  .animate-slide-in-right {
    animation: slideInFromRight 0.5s ease-in-out;
  }

  .animate-slide-in-left {
      animation: slideInFromLeft 0.5s ease-in-out;
  }

  /* Add new animation for highlighting a completed/submitted item */
  @keyframes highlightFade {
    from { background-color: rgba(59, 130, 246, 0.3); } /* A blue highlight */
    to { background-color: rgba(15, 23, 42, 0.5); } /* The card's default bg-slate-900/50 */
  }

  .animate-highlight-fade {
    animation: highlightFade 1.5s ease-out;
  }
</style>
</head>
  <body class="text-slate-200">
    <div id="root"></div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
